# Base configuration (baked). entrypoint.sh appends port/TLS, memory and ACL
# lines rendered from the environment. Cache only: nothing is persisted.
bind 0.0.0.0 -::*
protected-mode yes
tcp-keepalive 60
timeout 0
daemonize no
loglevel notice
logfile ""
databases 16
save ""
appendonly no
dir /data
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-user-del yes
# Keys are evicted, never written to disk; replicas are not used.
replica-read-only yes
# ACL log for denied commands (ACL LOG).
acllog-max-len 256
