# Performance recipe (copy to .ddev/nginx/). Makes the DDEV origin send
# production-like cache headers for Drupal's CSS/JS aggregates.
# DDEV's default site config sends "expires -1" (Cache-Control: no-cache) for
# every .js/.css, and Front Door (and the lab edge) never caches no-cache
# responses, so without this the edge cannot cache aggregates in DDEV.
# "^~" prefix locations win over DDEV's regex locations. Aggregates have
# content-hash file names, so a long lifetime is safe.
location ^~ /sites/default/files/css/ {
    try_files $uri @rewrite;
    expires 1y;
    add_header Cache-Control "public" always;
    log_not_found off;
}
location ^~ /sites/default/files/js/ {
    try_files $uri @rewrite;
    expires 1y;
    add_header Cache-Control "public" always;
    log_not_found off;
}
