# EXAMPLE (optional, DevOps-owned): purge Front Door's theme files after a new
# site container is deployed. It deploys NOTHING: Deployment Center's registry
# webhook still pulls the image and restarts the app; the same push starts this
# pipeline, which waits, then purges /themes/*. Not run yet: confirm on the
# first qa push (the pipeline run shows the purge step succeeded).
# Guide: docs/frontdoor-setup-guide.md, "Purge after a deploy".
# Service connection: manual ARM, Environment AzureUSGovernment, ACR Contributor
# or Owner (for the trigger) + the purge-only role on each endpoint.

trigger: none
pr: none

variables:
  # Default 10 (ruled 2026-10-09). Why: Learn gives no "pull finished" signal;
  # it says the switch "might take a few minutes" and the platform waits up to
  # 230 s for a container start by default (WEBSITES_CONTAINER_START_TIME_LIMIT).
  # When to change: raise it if the app sets a longer start limit or the qa
  # run still shows an old theme file. Don't poll a health URL instead: the old
  # container keeps answering 200 until the new one is ready [Learn].
  waitMinutes: 10

resources:
  containers:
    # One per environment: resources.triggeringAlias says which tag moved.
    - container: siteqa
      type: ACR
      azureSubscription: <arm-service-connection>
      resourceGroup: <registry-resource-group>
      registry: <registry-name>              # the name before .azurecr.us
      repository: <site image repository>
      trigger:
        tags:
          include:
            - qa      # default: same tag names as the Redis image (redis/bin/docker-deploy)
    - container: siteprod
      type: ACR
      azureSubscription: <arm-service-connection>
      resourceGroup: <registry-resource-group>
      registry: <registry-name>
      repository: <site image repository>
      trigger:
        tags:
          include:
            - prod    # change both if the site uses other tags: App Service > Deployment Center > Settings > Tag

stages:
  - stage: qa
    condition: eq(variables['resources.triggeringAlias'], 'siteqa')
    jobs:
      - job: purge_qa
        steps:
          - checkout: none
          - task: AzureCLI@2
            displayName: Wait for the qa app, then purge /themes/*
            inputs:
              azureSubscription: <arm-service-connection>
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                echo "Pushed: $(resources.container.siteqa.digest); waiting $(waitMinutes) min"
                sleep $(( $(waitMinutes) * 60 ))
                az afd endpoint purge --resource-group <qa-frontdoor-resource-group> --profile-name <qa-profile> \
                  --endpoint-name <qa-endpoint> --domains <qa site host name> --content-paths '/themes/*'

  - stage: prod
    condition: eq(variables['resources.triggeringAlias'], 'siteprod')
    dependsOn: []
    jobs:
      - job: purge_prod
        steps:
          - checkout: none
          - task: AzureCLI@2
            displayName: Wait for the prod app, then purge /themes/*
            inputs:
              azureSubscription: <arm-service-connection>
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                echo "Pushed: $(resources.container.siteprod.digest); waiting $(waitMinutes) min"
                sleep $(( $(waitMinutes) * 60 ))
                az afd endpoint purge --resource-group <prod-frontdoor-resource-group> --profile-name <prod-profile> \
                  --endpoint-name <prod-endpoint> --domains <prod site host name> --content-paths '/themes/*'
