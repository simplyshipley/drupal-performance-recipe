# Cache tags and delete hooks become Front Door purge paths.
#
# The queuer is a cache_tags_invalidator, so core creates it together with the
# cache tags service, very early. It therefore reaches the mapper and the
# enqueuer through service closures (see PathsQueuer); injecting them directly
# would create a circular reference.
services:
  _defaults:
    autowire: true

  logger.channel.perf_purge_paths:
    parent: logger.channel_base
    arguments: ['perf_purge_paths']

  perf_purge_paths.mapper:
    class: Drupal\perf_purge_paths\PathMapper
  Drupal\perf_purge_paths\PathMapper: '@perf_purge_paths.mapper'

  perf_purge_paths.enqueuer:
    class: Drupal\perf_purge_paths\PurgeEnqueuer

  perf_purge_paths.queuer:
    class: Drupal\perf_purge_paths\PathsQueuer
    tags:
      - { name: cache_tags_invalidator }
  Drupal\perf_purge_paths\PathsQueuer: '@perf_purge_paths.queuer'

  Drupal\perf_purge_paths\Hook\PerfPurgePathsHooks: ~
