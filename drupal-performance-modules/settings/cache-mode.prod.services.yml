# Cache mode "prod-like" (example.settings.local-lab.php, PERF_CACHE_MODE).
# Loaded last, so it switches off Twig debugging even if services.yml or
# sites/development.services.yml turned it on. Values = Drupal core defaults.
parameters:
  http.response.debug_cacheability_headers: false
  twig.config:
    debug: false
    auto_reload: null
    cache: true
    allowed_file_extensions: [css, html, js, svg, twig]
