name: 'Performance: Redis, Purge (Azure Front Door)'
description: 'Installs Redis, Purge with the Azure CDN/Front Door purger (path-based), BigPipe and syslog, and sets core cache and aggregation settings. Connection details and credentials live in settings/settings.performance.php (environment variables), never in config.'
type: 'Performance'
install:
  - page_cache
  - dynamic_page_cache
  - big_pipe
  - syslog
  - redis
  - purge
  - purge_ui
  - purge_processor_cron
  - purge_drush
  - azure_cdn_purge
  # From the drupal-performance-modules Composer package (web/modules/custom).
  # They depend on redis, purge and azure_cdn_purge above.
  - perf_redis_failopen
  - perf_purge_paths
config:
  # purge.plugins and azure_cdn_purge.settings ship no default config, so the
  # recipe provides them in config/ (created only if the site has none yet).
  actions:
    system.performance:
      simpleConfigUpdate:
        cache.page.max_age: 900
        css.preprocess: true
        js.preprocess: true
