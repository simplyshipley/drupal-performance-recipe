# Redis settings for the performance recipe lab (replaces the add-on's
# .ddev/redis/redis.conf; this file has no #ddev-generated marker so DDEV
# keeps it). Mirrors the production guidance: explicit maxmemory,
# volatile-lfu (redis module README, "Eviction policy"), no persistence.
maxmemory 256mb
maxmemory-policy volatile-lfu
appendonly no
save ""
